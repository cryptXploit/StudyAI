version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/node/.n8n

  # Local Supabase setup core services
  # Note: A full local Supabase environment is normally started via the Supabase CLI (`npx supabase start`).
  # This provides the core db representation for the docker-compose stack.
  supabase-db:
    image: supabase/postgres:15.1.1.06
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: your-super-secret-and-long-postgres-password
    volumes:
      - db_data:/var/lib/postgresql/data

  supabase-studio:
    image: supabase/studio:20240101-f123456
    ports:
      - "54323:3000"
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: your-super-secret-and-long-postgres-password
      SUPABASE_URL: http://localhost:8000
      SUPABASE_ANON_KEY: your-anon-key

volumes:
  redis_data:
  n8n_data:
  db_data:
